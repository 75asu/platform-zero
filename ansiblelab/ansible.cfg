[defaults]
inventory            = inventory/hosts.yaml
roles_path           = roles
# host_key_checking stays True on purpose: it lets the per-host
# StrictHostKeyChecking=accept-new (set in the inventory) take effect.
# Setting it False would make Ansible inject StrictHostKeyChecking=no, which
# also silently accepts CHANGED host keys (MITM-blind). accept-new does not.
host_key_checking    = True
forks                = 20
timeout              = 15
interpreter_python   = auto_silent
stdout_callback      = ansible.builtin.default
result_format        = yaml
callbacks_enabled    = ansible.builtin.timer
deprecation_warnings = False
system_warnings      = False

[ssh_connection]
pipelining = True
# Connection multiplexing: reuse one SSH connection across tasks/hosts.
# Ansible's default ControlPath lives in ~/.ansible/cp (short, macOS-safe).
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s
retries    = 2
